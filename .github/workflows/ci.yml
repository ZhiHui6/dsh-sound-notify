name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check verify.mjs
      - name: Validate manifest and locales
        run: |
          node -e "
          const fs = require('fs');
          for (const file of ['package.json', 'locale/en.json', 'locale/zh.json']) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log('ok', file);
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.dsh || !pkg.dsh.bundle || !pkg.dsh.bundle.patch) {
            throw new Error('package.json is missing dsh.bundle.patch');
          }
          for (const file of ['index.js', 'client.js', 'cordis.patch.yml', 'icon.svg']) {
            if (!fs.existsSync(file)) throw new Error('missing runtime file: ' + file);
          }
          console.log('manifest ok');
          "
      - name: Verify behaviour
        run: node verify.mjs
